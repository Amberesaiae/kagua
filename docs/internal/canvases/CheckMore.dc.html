    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{t.soft}}">“<span style="background: {{t.markBg}}; color: {{t.text}}; padding: 0 2px; border-radius: 3px">tuongee WhatsApp</span>” <span style="font: 600 11px 'Geist Mono', monospace; color: {{t.warnInk}}">OFF-APP</span></p>

    <div style="height: 1px; background: {{t.track}}; margin: 0 18px"></div>
    <label style="display: flex; gap: 14px; align-items: flex-start; padding: 18px; cursor: pointer">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #C6F432; flex-shrink: 0">
      <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 500">Amount is exactly <span style="font-family: 'Geist Mono', monospace">KES [AMOUNT]</span></span><span style="font-size: 13px; color: {{t.muted}}">Received, not “pending”.</span></span>
    </label>
    <div style="height: 1px; background: {{t.track}}; margin: 0 18px"></div>
    <label style="display: flex; gap: 14px; align-items: flex-start; padding: 18px; cursor: pointer">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #C6F432; flex-shrink: 0">
      <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 500">Sender name matches buyer_ken</span><span style="font-size: 13px; color: {{t.muted}}">Same name as on the trade.</span></span>
    </label>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 58px; border: 0; border-radius: 22px; background: #C6F432; color: #050605; font: 600 17px Geist, sans-serif; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)">Paste the SMS, Kagua compares</button>

  </div>
</div>
