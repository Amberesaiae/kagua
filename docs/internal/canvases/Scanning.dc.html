<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kagua · Checking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes kg-spin{to{transform:rotate(360deg)}}
@keyframes kg-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes kg-breathe{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
.kg-sweep{animation:kg-spin 1.8s linear infinite}
.kg-glow{animation:kg-breathe 2.4s ease-in-out infinite}
.kg-shimmer{background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:kg-shimmer 2.4s linear infinite}
@media (prefers-reduced-motion: reduce){.kg-sweep,.kg-glow,.kg-shimmer{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 42px 22px 26px">
  <div style="display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; background: {{t.glass}}; box-shadow: {{t.ring}}; font-size: 12px; color: {{t.soft}}">
    <span style="width: 6px; height: 6px; border-radius: 999px; background: #8BC000; box-shadow: 0 0 8px #C6F432"></span>
    No internet used
  </div>

  <div style="position: relative; width: 260px; height: 260px; margin-top: 70px; display: flex; align-items: center; justify-content: center">
    <div class="kg-glow" style="position: absolute; inset: -40px; border-radius: 999px; background: radial-gradient(circle, {{t.halo}} 0%, rgba(198,244,50,0) 65%)"></div>
    <div style="position: absolute; inset: 0; border-radius: 999px; box-shadow: {{t.ring}}"></div>
    <div class="kg-sweep" style="position: absolute; inset: 0; border-radius: 999px; background: conic-gradient(from 0deg, rgba(198,244,50,0) 0deg, rgba(198,244,50,0) 220deg, {{t.sweep}} 360deg)"></div>
    <div style="position: absolute; inset: 3px; border-radius: 999px; background: {{t.bg}}"></div>
    <div style="position: absolute; inset: 34px; border-radius: 999px; background: {{t.glass}}; box-shadow: {{t.ring}}"></div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font: 500 44px 'Geist Mono', monospace; letter-spacing: -0.04em">3<span style="color: {{t.faint}}">/4</span></span>
      <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.muted}}">checks</span>
    </div>
  </div>

  <h1 class="kg-shimmer" style="margin: 56px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.035em; background-image: {{t.shimmer}}">Checking frozen list</h1>
  <p style="margin: 10px 0 0; font: 500 14px 'Geist Mono', monospace; color: {{t.muted}}">TQn9Y2…w5KcbLSE</p>

  <div style="margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 3px; border-radius: 3px; background: {{t.sweep}}"></span><span style="font-size: 11px; color: {{t.soft}}">Checksum</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 3px; border-radius: 3px; background: {{t.sweep}}"></span><span style="font-size: 11px; color: {{t.soft}}">Network</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span class="kg-glow" style="height: 3px; border-radius: 3px; background: {{t.sweep}}"></span><span style="font-size: 11px; color: {{t.text}}">Frozen list</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="height: 3px; border-radius: 3px; background: {{t.track}}"></span><span style="font-size: 11px; color: {{t.muted}}">Look-alike</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      dark: { bg: '#050605', text: '#F4F7F1', soft: '#C9D0C6', muted: '#8F988C', faint: '#6F786C', track: 'rgba(255,255,255,0.1)', glass: 'rgba(255,255,255,0.04)', ring: 'inset 0 0 0 1px rgba(255,255,255,0.08)', halo: 'rgba(198,244,50,0.22)', sweep: '#C6F432', shimmer: 'linear-gradient(100deg,#7A8377 0%,#7A8377 35%,#F4F7F1 45%,#C6F432 50%,#F4F7F1 55%,#7A8377 65%,#7A8377 100%)' },
      light: { bg: '#F3F4EE', text: '#0B0D0C', soft: '#3A4137', muted: '#5B6358', faint: '#9AA196', track: 'rgba(11,13,12,0.1)', glass: 'rgba(255,255,255,0.8)', ring: 'inset 0 0 0 1px rgba(11,13,12,0.08)', halo: 'rgba(170,220,10,0.35)', sweep: '#8BC000', shimmer: 'linear-gradient(100deg,#0B0D0C 0%,#0B0D0C 38%,#5E8A00 48%,#8BC000 50%,#5E8A00 52%,#0B0D0C 62%,#0B0D0C 100%)' }
    };
    return { t: T[this.props.theme] || T.dark };
  }
}
</script>
</body>
</html>
